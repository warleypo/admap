<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Gerenciador de Territórios Avançado</title>

    <!-- CSS Leaflet, Geoman e GeoSearch -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-geosearch@3.11.1/dist/geosearch.css"
    />

    <!-- CSS da Aplicação -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- JS Leaflet e Plugins -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script src="https://unpkg.com/leaflet-geosearch@3.11.1/dist/geosearch.umd.js"></script>
    <!-- html2canvas para captura de imagem do mapa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Biblioteca oficial para exportação limpa de mapas Leaflet -->
    <script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>

    <script>
      if (L.LineUtil && !L.LineUtil._flat) {
        L.LineUtil._flat = L.LineUtil.isFlat;
      }
    </script>
  </head>
  <body>
    <div id="toast" class="toast-notification"></div>

    <!-- Sidebar -->
    <div id="sidebar">
      <div class="header">
        <h2>Gerenciador de Territórios</h2>
        <p>Janaúba - MG</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" style="width: 100%" id="btnStartDraw">
          + Desenhar Território
        </button>
        <button
          class="btn btn-campaign"
          style="width: 100%"
          id="btnOpenCampaign"
        >
          🚀 Gerenciar Campanhas
        </button>
        <button class="btn btn-report" style="width: 100%" id="btnOpenReport">
          📊 Relatórios
        </button>
        <button class="btn btn-print-map" style="width: 100%" id="btnPrintMap">
          🖨️ Imprimir Mapa Atual
        </button>
        <label class="global-toggle">
          <input type="checkbox" id="togglePrintGuide" />
          📐 Exibir Moldura A4 (Impressão)
        </label>
        <label class="global-toggle">
          <input type="checkbox" id="globalShowAll" />
          Exibir Todos os Territórios
        </label>
        <div class="rotate-hint">
          💡 <b>Dica de Rotação:</b> Pressione <code>Shift</code> + Arraste o
          mouse para girar.
        </div>
      </div>
      <div class="territory-list" id="territoryList"></div>
    </div>

    <div id="map"></div>
    <div
      id="a4PrintGuide"
      class="a4-print-guide-overlay"
      style="display: none"
    ></div>
    <div id="printReportArea"></div>

    <!-- Modal 1: Novo/Editar Território -->
    <div class="modal-overlay" id="modalTerritory">
      <div class="modal">
        <h3 id="modalTerritoryTitle">Cadastrar Território</h3>
        <div class="form-group">
          <label>Nome do Território / Bairro</label>
          <input
            type="text"
            id="territoryNameInput"
            placeholder="Ex: Dona Lindu"
          />
        </div>
        <div class="form-group">
          <label>Cor do Território</label>
          <input type="color" id="territoryColorInput" value="#3b82f6" />
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="btnCancelTerritoryModal">
            Cancelar
          </button>
          <button class="btn btn-primary" id="btnSaveTerritoryInfo">
            Salvar
          </button>
        </div>
      </div>
    </div>

    <!-- Modal 2: Editar Quadra -->
    <div class="modal-overlay" id="modalQuadra">
      <div class="modal">
        <h3 id="modalQuadraTitle">Editar Quadra</h3>
        <div class="form-group">
          <label>Status da Quadra</label>
          <select id="statusSelect">
            <option value="pendente">Pendente</option>
            <option value="andamento">Em Andamento</option>
            <option value="concluida">Concluída</option>
          </select>
        </div>
        <div class="form-group">
          <label>Data de Início</label>
          <input type="date" id="startDateInput" />
        </div>
        <div class="form-group">
          <label>Data de Término</label>
          <input type="date" id="endDateInput" />
        </div>
        <div class="modal-actions" style="justify-content: space-between">
          <button class="btn btn-danger" id="btnDeleteQuadra">
            🗑️ Excluir Quadra
          </button>
          <div>
            <button
              class="btn btn-secondary"
              onclick="
                document.getElementById('modalQuadra').style.display = 'none'
              "
            >
              Cancelar
            </button>
            <button class="btn btn-primary" id="btnSaveQuadra">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal 3: Gerenciar Campanhas -->
    <div class="modal-overlay" id="modalCampaign">
      <div class="modal">
        <h3>Gerenciador de Campanhas</h3>
        <div class="form-group">
          <label>Nome da Nova Campanha</label>
          <input
            type="text"
            id="campaignNameInput"
            placeholder="Ex: Campanha de Inverno"
          />
        </div>
        <button
          class="btn btn-campaign"
          style="width: 100%; margin-bottom: 15px"
          id="btnCreateCampaign"
        >
          Iniciar Campanha (Pausar Trabalho Normal)
        </button>

        <h4>Campanhas Registradas</h4>
        <div id="campaignListArea" style="margin-top: 10px"></div>

        <div class="modal-actions">
          <button
            class="btn btn-secondary"
            onclick="
              document.getElementById('modalCampaign').style.display = 'none'
            "
          >
            Fechar
          </button>
        </div>
      </div>
    </div>

    <!-- Modal 4: Relatório -->
    <div class="modal-overlay" id="modalReportFilter">
      <div class="modal">
        <h3>Relatório de Trabalho</h3>
        <div class="form-group">
          <label>Selecione o Período / Campanha</label>
          <select id="reportCampaignSelect"></select>
        </div>
        <div class="modal-actions">
          <button
            class="btn btn-secondary"
            onclick="
              document.getElementById('modalReportFilter').style.display =
                'none'
            "
          >
            Cancelar
          </button>
          <button class="btn btn-report" id="btnGenerateReport">
            🖨️ Gerar e Imprimir Relatório
          </button>
        </div>
      </div>
    </div>

    <!-- Scripts MVC da Aplicação -->
    <script src="js/models/TerritoryModel.js"></script>
    <script src="js/views/MapView.js"></script>
    <script src="js/views/UIView.js"></script>
    <script src="js/controllers/AppController.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
